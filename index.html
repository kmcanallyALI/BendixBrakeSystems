<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Bendix EC-80 / Fusion Troubleshooting Training — Andrews Logistics</title>
<style>
  :root{
    --navy:#0b2545; --blue:#1560bd; --amber:#e8a628; --gray:#f4f6f8;
    --text:#1a1f27; --ok:#1e8f4e; --bad:#c23a2e;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--gray);color:var(--text);}
  header{background:var(--navy);color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;}
  header h1{font-size:1.15rem;margin:0;}
  header .badge{background:var(--amber);color:#1a1f27;padding:4px 10px;border-radius:4px;font-size:.8rem;font-weight:600;}
  #app{max-width:880px;margin:0 auto;padding:28px 20px 80px;}
  .card{background:#fff;border-radius:10px;padding:28px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:20px;}
  h2{color:var(--navy);margin-top:0;}
  h3{color:var(--blue);}
  button{cursor:pointer;border:none;border-radius:6px;padding:12px 22px;font-size:1rem;font-weight:600;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:disabled{background:#9db6d0;cursor:not-allowed;}
  .btn-secondary{background:#e2e8ef;color:var(--navy);}
  .btn-ref{background:#fff;color:var(--blue);border:2px solid var(--blue);padding:8px 14px;font-size:.9rem;margin:4px 6px 4px 0;}
  .btn-ref:hover{background:var(--blue);color:#fff;}
  input[type=text]{width:100%;padding:12px;font-size:1rem;border:1px solid #ccc;border-radius:6px;}
  .progress-bar{height:8px;background:#e2e8ef;border-radius:4px;overflow:hidden;margin-bottom:24px;}
  .progress-fill{height:100%;background:var(--blue);transition:width .3s;}
  .section-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .section-pill{padding:6px 12px;border-radius:20px;background:#e2e8ef;font-size:.8rem;color:var(--navy);}
  .section-pill.done{background:var(--ok);color:#fff;}
  .section-pill.active{background:var(--blue);color:#fff;}
  .fact-box{background:#eef4fb;border-left:4px solid var(--blue);padding:12px 16px;margin:14px 0;border-radius:4px;}
  .warn-box{background:#fdecea;border-left:4px solid var(--bad);padding:12px 16px;margin:14px 0;border-radius:4px;}
  table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.92rem;}
  th,td{border:1px solid #ddd;padding:8px;text-align:left;}
  th{background:#eef2f6;}
  .quiz-q{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #eee;}
  .quiz-opt{display:block;margin:6px 0;padding:10px 12px;border:1px solid #ccc;border-radius:6px;cursor:pointer;}
  .quiz-opt:hover{background:#f0f4f9;}
  .quiz-opt.selected{border-color:var(--blue);background:#e8f0fb;}
  .quiz-opt.correct{border-color:var(--ok);background:#e6f6ec;}
  .quiz-opt.incorrect{border-color:var(--bad);background:#fbeceb;}
  .result-banner{padding:16px;border-radius:8px;font-weight:600;margin-bottom:16px;}
  .result-pass{background:#e6f6ec;color:var(--ok);}
  .result-fail{background:#fbeceb;color:var(--bad);}
  .doc-embed{width:100%;height:75vh;border:1px solid #ccc;border-radius:6px;margin-top:12px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;}
  .modal-box{background:#fff;border-radius:10px;padding:20px;max-width:1000px;width:100%;max-height:92vh;overflow:auto;}
  .modal-close{float:right;}
  #certificate{background:#fffdf6;border:10px double var(--navy);padding:50px;text-align:center;}
  #certificate h1{color:var(--navy);font-size:2rem;margin-bottom:0;}
  #certificate .name{font-size:1.8rem;color:var(--blue);margin:18px 0;border-bottom:2px solid var(--amber);display:inline-block;padding-bottom:6px;}
  .small{font-size:.85rem;color:#555;}
  .welcome-back{background:#eef8ee;border:1px solid var(--ok);padding:16px;border-radius:8px;margin-bottom:16px;}
  @media print{
    header,.no-print{display:none !important;}
    body{background:#fff;}
  }
</style>

<header>
  <h1>Bendix EC-80 / Fusion Troubleshooting Training</h1>

<div id="app"></div>

<script>
/* ============================================================
   BENDIX TROUBLESHOOTING TRAINING COURSE
   Andrews Logistics — reference-and-test course built from
   Bendix EC-80 ABS/ATC, FLC-25 Camera, and FLR-25 Radar
   Service Data sheets.
   ============================================================ */

const RESULTS_ENDPOINT_CHECK = "/.netlify/functions/check-name";
const RESULTS_ENDPOINT_RECORD = "/.netlify/functions/record-result";
const PASS_THRESHOLD = 0.8;

const REFERENCE_DOCS = [
  {id:"esp", label:"EC-80 ESP Service Data (SD-13-4986)", file:"docs/EC-80_ESP.pdf"},
  {id:"camera", label:"FLC-25 Camera Service Data (SD-29-50024)", file:"docs/FLC25_Camera.pdf"},
  {id:"radar", label:"FLR-25 Radar Service Data (SD-29-50022)", file:"docs/FLR25_Radar.pdf"},
  {id:"abs-atc", label:"EC-80 ABS/ATC Service Data (SD-13-4983) — background reference only, not the system on Andrews units", file:"docs/EC-80_ABS-ATC.pdf"}
];

function docsByIds(ids){ return REFERENCE_DOCS.filter(d => ids.includes(d.id)); }

/* ---------------- SECTIONS ---------------- */
const SECTIONS = [
{
  key:"power",
  title:"1. Power Supply & ESP System Basics",
  refs:["esp"],
  content:`
    <p>Andrews units are equipped with the <b>Bendix ESP EC-80</b> controller — the top tier of the EC-80
    family, adding Yaw Control (YC) and Roll Stability Program (RSP) on top of standard ABS and ATC. It uses
    <b>four</b> wire harness connectors (X1–X4), where X4 carries the stability sensors: Steering Angle
    Sensor (SAS), Yaw Rate/Lateral Acceleration Sensor (YRS/LAS), ABS Pressure Sensors, and ABS Air Bag
    Pressure Sensor.</p>
    <div class="fact-box"><b>Operating voltage range:</b> 9.0–17.0 VDC on 12-volt systems, and
    20–33.5 VDC on 24-volt systems. Outside these ranges, ABS, ATC, and ESP are all disabled and the
    vehicle reverts to normal braking until voltage is restored.</div>
    <table>
      <tr><th>Test</th><th>Spec</th></tr>
      <tr><td>Ignition/Battery-to-Ground (under load, 12V system)</td><td>9–17 VDC</td></tr>
      <tr><td>Ignition/Battery-to-Ground (under load, 24V system)</td><td>20–33.5 VDC</td></tr>
      <tr><td>FLC-25 camera supply (pin 7 to ground, under load)</td><td>10–16 VDC</td></tr>
      <tr><td>FLR-25 radar supply (pin 1 to ground pin 8, under load)</td><td>10–16 VDC</td></tr>
    </table>
    <div class="warn-box"><b>ESP controllers are parameter-matched to the vehicle.</b> When replacing an
    ESP EC-80 controller, only a Controller with the correct validated parameter set may be used — you
    cannot simply swap in any EC-80 unit. If the vehicle's chassis has been modified (wheelbase change, axle
    addition/removal, major body change, steering/suspension changes), the ESP system must be disabled and
    the ESP EC-80 Controller replaced with an <b>ESP ATC EC-80 Controller</b> by a qualified mechanic, with
    the now-unused X4 connector secured and all ESP-related cab signage removed. Running ESP disabled but
    unmarked risks a driver assuming stability protection is active when it isn't.</div>
    <p>Fusion system dependency still applies: the Fusion system (radar + camera + ESP EC-80) will not
    operate — and will set its own DTC — if the engine, engine cruise, instrument cluster, transmission, or
    ABS/ATC/ESP already has an active DTC. Clear vehicle-level DTCs first.</p>
  `,
  quiz:[
    {q:"What is the normal 12-volt operating voltage range for the ESP EC-80 controller?",
     opts:["6.0–12.0 VDC","9.0–17.0 VDC","20–33.5 VDC","5.0–9.0 VDC"], a:1},
    {q:"What is the operating voltage range for a 24-volt ESP EC-80 system?",
     opts:["9.0–17.0 VDC","18–24 VDC","20–33.5 VDC","30–40 VDC"], a:2},
    {q:"How many wire harness connectors does the ESP EC-80 controller use, and what does the extra one (X4) carry?",
     opts:["Two; nothing extra","Three; the trailer ABS lamp","Four; the stability sensors (SAS, YRS/LAS, ABS pressure sensors)","Five; the engine ECU link"], a:2},
    {q:"If a vehicle's chassis is significantly modified (e.g., wheelbase change), what must happen to the ESP system?",
     opts:["Nothing, ESP adapts automatically","ESP must be disabled and the controller replaced with an ESP ATC EC-80 Controller, with cab signage updated","Only the tires need to be recalibrated","The radar must be removed"], a:1},
    {q:"Can any EC-80 controller be used as a replacement on an ESP-equipped vehicle?",
     opts:["Yes, any EC-80 controller works","No — only a Controller with the correct validated parameter set for that vehicle may be used","Yes, as long as it has four connectors","Only if it's a 12-volt unit"], a:1}
  ]
},
{
  key:"wss-pmv",
  title:"2. Wheel Speed Sensors, PMVs & Traction/Stability Valves",
  refs:["esp"],
  content:`
    <p>Wheel speed sensor (WSS) and pressure modulator valve (PMV) checks are the same starting point on ESP
    units as on any EC-80 system — simple resistance checks before condemning a part.</p>
    <table>
      <tr><th>Component</th><th>Measurement</th><th>Spec</th></tr>
      <tr><td>WSS, sensor leads</td><td>Resistance</td><td>1500–2500 Ω</td></tr>
      <tr><td>WSS output</td><td>AC voltage @ ~0.5 rev/sec</td><td>&gt;0.25 VAC</td></tr>
      <tr><td>PMV Release–Common / Hold–Common</td><td>Resistance</td><td>4.9–5.5 Ω</td></tr>
      <tr><td>PMV Release–Hold</td><td>Resistance</td><td>9.8–11.0 Ω</td></tr>
      <tr><td>TCV to TCV Common</td><td>Resistance</td><td>7–19 Ω</td></tr>
    </table>
    <div class="fact-box"><b>Tire size calibration (ESP systems, 100-tooth exciter ring):</b> acceptable
    range is <b>376–665</b> revolutions/mile (default 510). The steer-axle-to-drive-axle effective rolling
    circumference ratio must stay between <b>0.85 and 1.15</b>. If tires are changed enough to require an
    odometer correction, the ECU's tire size setting must also be reprogrammed — the ESP system's
    effectiveness depends on accurate vehicle speed.</div>
    <p>Automatic calibration only updates when: the ratio is in range, vehicle speed is above ~12 mph,
    there's no acceleration/deceleration, and there are no active WSS DTCs.</p>
    <div class="warn-box"><b>DTC hierarchy — what stays active:</b> a Steer Axle ABS Modulator DTC disables
    ESP entirely (ABS/ATC keep working on unaffected wheels). A Drive/Additional Axle ABS Modulator or WSS
    DTC disables ATC and ESP but keeps ABS active on unaffected wheels. An ECU or Voltage DTC disables ABS,
    ATC, and ESP together, reverting to normal braking.</div>
  `,
  quiz:[
    {q:"For an ESP-equipped vehicle with a 100-tooth exciter ring, what is the acceptable tire revolutions-per-mile range?",
     opts:["100–200","300–425","376–665","700–800"], a:2},
    {q:"What is the acceptable steer-axle-to-drive-axle rolling circumference ratio range?",
     opts:["0.50–1.50","0.85–1.15","1.0 exactly, no tolerance","2.0–3.0"], a:1},
    {q:"If a Steer Axle ABS Modulator DTC sets, what happens to ESP?",
     opts:["Nothing, ESP is unaffected","ESP is disabled; ABS/ATC remain active on unaffected wheels","The whole vehicle shuts down","Only the trailer brakes are affected"], a:1},
    {q:"What resistance should you expect across a wheel speed sensor's leads?",
     opts:["0–10 Ω","1500–2500 Ω","4.9–5.5 Ω","9.8–11.0 Ω"], a:1},
    {q:"What conditions must be met for the ECU to update its automatic tire size calibration?",
     opts:["Vehicle stopped with engine off","Ratio in range, speed above ~12 mph, no accel/decel, and no active WSS DTCs","Only during a blink code session","Anytime the ignition is cycled"], a:1},
    {q:"An ECU-level DTC or a voltage-out-of-range DTC affects which systems?",
     opts:["Only ESP","Only the radar","ABS, ATC, and ESP together — the vehicle reverts to normal braking","Only the trailer ABS lamp"], a:2}
  ]
},
{
  key:"stability",
  title:"3. Stability Sensors: SAS, Yaw Rate/Lateral Accel & ABS Pressure",
  refs:["esp"],
  content:`
    <p>This section is unique to ESP-equipped units — these sensors don't exist on plain ABS or ATC
    controllers. They're what make Yaw Control and Roll Stability Program possible.</p>
    <table>
      <tr><th>Sensor</th><th>Purpose</th><th>Calibration tool</th></tr>
      <tr><td>Steering Angle Sensor (SAS-60/SAS-70X)</td><td>Reads driver steering input, cross-checked against yaw rate</td><td>Bendix ACom (System Checks → Stability System Checks → Steering Angle Calibration)</td></tr>
      <tr><td>Yaw Rate / Lateral Accel Sensor (YAS-60/YAS-70X)</td><td>Measures rotation about the vertical axis and lateral acceleration</td><td>Bendix ACom only</td></tr>
      <tr><td>ABS Pressure Sensors</td><td>Primary/secondary delivery circuit pressure</td><td>Bendix ACom (no calibration needed once installed correctly)</td></tr>
      <tr><td>ABS Air Bag Pressure Sensor</td><td>Suspension air bag pressure, used for load-based stability calculations</td><td>Bendix ACom</td></tr>
    </table>
    <div class="warn-box"><b>Recalibrate the SAS any time</b> you perform maintenance on the steering
    mechanism, linkage, steering gear, wheel track adjustment, or replace the sensor itself — and don't
    alter its mounting location or orientation. If the SAS isn't recalibrated, yaw control may not function
    properly, which can lead to loss of vehicle control.</div>
    <p>Quick electrical checks at the X4 connector (SAS/YRS, ignition on — voltage is only present
    momentarily at key-on):</p>
    <ul>
      <li>SAS pins 3 &amp; 4: ~120 Ω</li>
      <li>With SAS and YRS both plugged in, ECU pins 7 &amp; 8: ~60 Ω</li>
      <li>SAS terminal 4/3 to voltage &amp; ground: open circuit (no continuity) expected</li>
    </ul>
    <div class="fact-box"><b>DTC 10 — SAS Plausibility Check:</b> the ECU compares the SAS signal against
    the Yaw Rate Sensor signal — the two should track together, not oppose one another. If they disagree,
    monitor both live in ACom before condemning either sensor.</div>
    <p>A SAS or YRS/LAS DTC disables the ESP function only — ABS and ATC remain fully active. Same for an
    ABS Pressure Sensor or ABS Air Bag Pressure Sensor DTC.</p>
  `,
  quiz:[
    {q:"Which sensor is unique to ESP-tier EC-80 controllers and not present on plain ABS or ATC systems?",
     opts:["Wheel speed sensor","Steering Angle Sensor / Yaw Rate Sensor","Pressure modulator valve","Battery voltage sensor"], a:1},
    {q:"When must the Steering Angle Sensor be recalibrated?",
     opts:["Never, it's maintenance-free","Any time steering mechanism, linkage, steering gear, or wheel track work is performed, or the sensor is replaced","Only once a year","Only after a tire rotation"], a:1},
    {q:"What tool is required to calibrate the SAS and YRS?",
     opts:["A basic multimeter only","Bendix ACom Diagnostic Software","A torque wrench","The blink code switch alone"], a:1},
    {q:"What does DTC code 10 (SAS Plausibility Check) indicate?",
     opts:["A blown fuse","The SAS signal disagrees with the Yaw Rate Sensor signal — they should track together","The tires are the wrong size","J1939 is disconnected"], a:1},
    {q:"If a Yaw Rate/Lateral Acceleration Sensor DTC sets, what happens to ABS and ATC?",
     opts:["They are also disabled","They remain fully active — only ESP is disabled","The vehicle won't start","They switch to off-road mode"], a:1},
    {q:"What should you check before condemning the SAS or YRS if a plausibility DTC is active?",
     opts:["Replace both sensors immediately","Monitor both sensors' live data in ACom — their signals should track together, not oppose each other","Check tire pressure","Nothing further is needed"], a:1}
  ]
},
{
  key:"j1939-blink",
  title:"4. J1939 Communications & Blink Code Diagnostics",
  refs:["esp"],
  content:`
    <p>Blink codes let you troubleshoot without a laptop. The ABS indicator lamp blinks two-digit code
    groups; record each group and look it up in the DTC index.</p>
    <table>
      <tr><th>Switch presses</th><th>Mode entered</th></tr>
      <tr><td>1</td><td>Active DTC retrieval</td></tr>
      <tr><td>2</td><td>Inactive DTC retrieval</td></tr>
      <tr><td>3</td><td>Clear active DTCs</td></tr>
      <tr><td>4</td><td>System configuration check</td></tr>
      <tr><td>5</td><td>Dynamometer Test Mode</td></tr>
      <tr><td>7 (held before power-up)</td><td>Reconfigure ECU</td></tr>
    </table>
    <div class="fact-box"><b>System Configuration Check on ESP units is a 7-digit sequence</b> (one digit
    longer than plain ABS/ATC controllers), because it includes a 7th number for Stability Configuration:
    <b>1 = No Stability Program, 2 = Electronic Stability Program (ESP)</b>. The other six digits cover
    system voltage, wheel speed sensor count, PMV count, ABS configuration, traction control configuration,
    and retarder configuration, in that order.</div>
    <div class="warn-box"><b>Dynamometer Test Mode on ESP units disables more than on plain ABS/ATC:</b> it
    turns off ATC brake control, ATC engine control, drag torque control, <i>and</i> the full ESP system —
    and it stays engaged even through a power cycle. Exit it with 3 presses of the blink switch or a
    diagnostic tool. Power must also be disconnected from the radar sensor during any dyno test on a
    Fusion/Wingman-equipped vehicle.</div>
    <p>J1939 wiring: J1939 Low and J1939 High must never be shorted together or reversed — either fault can
    take down the whole serial link, sometimes intermittently, logging multiple DTCs across several
    controllers at once.</p>
  `,
  quiz:[
    {q:"How many digits does the System Configuration Check blink sequence use on an ESP-equipped controller?",
     opts:["Five","Six","Seven","Ten"], a:2},
    {q:"What does the 7th digit of the ESP System Configuration Check represent?",
     opts:["Retarder configuration","Stability configuration (1 = none, 2 = ESP)","Tire size","Battery voltage"], a:1},
    {q:"On an ESP-equipped controller, what does Dynamometer Test Mode disable?",
     opts:["Only the radio","ATC brake/engine control, drag torque control, and the full ESP system","Only the headlights","Nothing, it's informational only"], a:1},
    {q:"How many times do you press the blink code switch to clear active DTCs?",
     opts:["1","2","3","4"], a:2},
    {q:"What must you disconnect before running a dynamometer test on a Fusion/Wingman-equipped ESP vehicle?",
     opts:["The horn","Power to the radar sensor","The parking brake valve","The J1939 backbone entirely"], a:1},
    {q:"What happens to the J1939 link if the High and Low wiring circuits are shorted together?",
     opts:["Nothing, J1939 is redundant","The entire J1939 link can be lost, sometimes intermittently, logging DTCs in multiple controllers","Only ATC is affected","The engine shuts off"], a:1}
  ]
},
{
  key:"fusion",
  title:"5. Fusion System: FLC-25 Camera & FLR-25 Radar",
  refs:["camera","radar"],
  content:`
    <p>The Bendix Fusion system pairs the FLR-25 radar and FLC-25 camera with the ESP EC-80 controller to
    deliver AEB, Highway Departure Braking, Active Cruise with Braking, and Overspeed Alert. Because

    <table>
      <tr><th>Component</th><th>Connector power pin(s)</th><th>Spec</th></tr>
      <tr><td>FLC-25 camera</td><td>Pin 7 (Module Power) to ground</td><td>10–16 VDC</td></tr>
      <tr><td>FLR-25 radar</td><td>Pin 1 to ground (pin 8)</td><td>10–16 VDC</td></tr>

    <div class="warn-box"><b>Radar mounting is not adjustable:</b> the radar must stay in its original OEM

    drive above 30 mph (typically 15–60 minutes) with ACom monitoring until it reports "Alignment
    Successful."</div>
    <p>Common false-troubleshooting trap: a "false brake application" reported by a driver is often actually
    a loss of engine throttle from a J1939 communication failure — frequently caused by aftermarket
    Electronic Driver Logs, GPS, or telematics devices tapped into the CAN line.</p>
    <p>Remember the dependency chain from Section 1: Fusion will not operate, and will set its own DTC, if
    the ESP EC-80 controller (or engine, transmission, cruise, or instrument cluster) already has an active

  `,
  quiz:[
    {q:"What voltage should you expect at the FLC-25 camera's Module Power pin (pin 7) to ground, under load?",
     opts:["5–9 VDC","10–16 VDC","12–24 VDC","0–5 VDC"], a:1},
    {q:"Can the FLR-25 radar sensor be repositioned from its original OEM mounting location?",

    {q:"After replacing a camera, how long might calibration take before you should suspect a real fault?",
     opts:["Up to 20 minutes of driving above 25 mph","5 seconds","It calibrates instantly at power-up","Only after a full oil change interval"], a:0},
    {q:"A driver reports unexplained loss of engine power they interpreted as a 'false brake event.' What should you suspect first?",
     opts:["A cracked windshield","A J1939 communication failure, often from an aftermarket EDL, GPS, or telematics device","A flat tire","Low coolant"], a:1},
    {q:"On an Andrews (ESP-tier) unit, what will block the Fusion system from operating even if the radar and camera are perfectly healthy?",
     opts:["Cold weather","An active DTC on the ESP EC-80 controller, engine, transmission, cruise, or instrument cluster","Driving over 55 mph","Using cruise control"], a:1}
  ]
},
{
  key:"wiring",
  title:"6. Wiring, Harnesses & Connectors",
  refs:["esp","camera","radar"],
  content:`
    <p>Most intermittent ESP and Fusion faults trace back to connectors and harness routing, not the
    controller itself — this is even more true on ESP units, which have a fourth connector (X4) and four
    extra stability-sensor circuits to keep clean.</p>
    <ul>
      <li>All wire harness connectors must be fully seated — push until they click/seal, and use secondary
      locks where provided.</li>
      <li>Unused ECU connectors (including a secured, no-longer-used X4 on a downgraded ESP-to-ATC
      controller swap) must be capped and protected from moisture at all times.</li>
      <li>Sensor and J1939 circuits must use twisted-pair wire (1–2 twists per inch).</li>
      <li>Route wires straight out of a connector for at least 3 inches before any bend.</li>
      <li>Secure wiring every 6–12 inches with UV-stabilized, non-metallic clamps or bow-tie ties — never
      standard tie-wraps directly on rubber air lines (pressure cycling can chafe through the wire jacket).</li>
      <li>Corroded connector terminals on a camera, radar, SAS, or YRS usually mean water intrusion —
      replace the whole harness; if the component's own terminals are corroded, replace the component.</li>
      <li>Never alter the mounting location or orientation of the SAS or Yaw Rate Sensor — if replacement is
      needed, use an identical part in the same orientation with OEM brackets and torque specs.</li>
    </ul>
    <div class="fact-box"><b>Diagnosis tip:</b> if a DTC clears and instantly comes back after a repair,
    recheck routing near rotating components (wheel ends, drive shafts) and near air line clamps first —
    chafe points reproduce themselves.</div>
  `,
  quiz:[
    {q:"How often should wiring be secured along its run (e.g., along service brake hoses)?",
     opts:["Every 1–2 inches","Every 6–12 inches (or 6–8 inches for sensor wiring along hoses)","Every 24 inches","Only at the connector"], a:1},
    {q:"Why does Bendix recommend against standard tie-wraps directly on rubber air lines?",
     opts:["They look unprofessional","Pressure cycling in the air line can cause premature wiring failure from the pressure exerted","They are more expensive","They interfere with J1939"], a:1},
    {q:"What should sensor and J1939 wiring circuits use?",
     opts:["Solid single-conductor wire","Twisted pair wiring (1–2 twists per inch)","Bare wire","Coaxial cable"], a:1},
    {q:"If the Steering Angle Sensor or Yaw Rate Sensor needs replacement, what's required?",
     opts:["Any compatible sensor works in any position","An identical part, in the same orientation, using OEM brackets and torque specs — location/orientation must not be altered","A cheaper aftermarket substitute is preferred","No special care is needed"], a:1},
    {q:"How far should wire be routed straight out of a connector before it's allowed to bend?",
     opts:["At least 3 inches","At least 12 inches","It doesn't matter","6 feet"], a:0}
  ]
}
];

/* ---------------- STATE ---------------- */
let state = {
  name: "",
  screen: "welcome",
  sectionIndex: 0,
  sectionResults: {}, // key -> {score, total, passed}
  reviewMode: false,
  activeDoc: null
};

function totalScorePct(){
  let correct=0, total=0;
  SECTIONS.forEach(s=>{
    const r = state.sectionResults[s.key];
    if(r){ correct += r.score; total += r.total; }
  });
  return total ? Math.round((correct/total)*100) : 0;
}
function allSectionsPassed(){
  return SECTIONS.every(s => state.sectionResults[s.key] && state.sectionResults[s.key].passed);
}

/* ---------------- RENDER ---------------- */
const app = document.getElementById("app");

function render(){
  app.innerHTML = "";
  if(state.screen === "welcome") return renderWelcome();
  if(state.screen === "reviewHome") return renderReviewHome();
  if(state.screen === "section") return renderSection();
  if(state.screen === "certificate") return renderCertificate();
}

function renderWelcome(){
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <h2>Welcome</h2>
    <p>This course covers troubleshooting the <b>Bendix ESP EC-80</b> controller — the system equipped on
    Andrews units — and the Bendix Fusion driver-assistance system (FLC-25 camera / FLR-25 radar),
    organized by troubleshooting topic rather than by document. It is not based on the base ABS/ATC
    controller, since that's not what's on our fleet.</p>
    <p>Enter your full legal name below. If you've already passed this course, you'll be dropped straight
    into <b>reference mode</b> so you can use it as a lookup tool without retaking the test.</p>
    <label><b>Full legal name</b></label>
    <input type="text" id="nameInput" placeholder="First Last" />
    <p style="margin-top:18px;">
      <button class="btn-primary" id="continueBtn">Continue</button>
    </p>
    <p id="lookupStatus" class="small"></p>
  `;
  app.appendChild(card);
  document.getElementById("continueBtn").onclick = onWelcomeContinue;
  document.getElementById("nameInput").addEventListener("keydown", e=>{ if(e.key==="Enter") onWelcomeContinue(); });
}

async function onWelcomeContinue(){
  const val = document.getElementById("nameInput").value.trim();
  const statusEl = document.getElementById("lookupStatus");
  if(!val){ statusEl.textContent = "Please enter your name to continue."; return; }
  state.name = val;
  statusEl.textContent = "Checking for prior completion...";
  try{
    const res = await fetch(RESULTS_ENDPOINT_CHECK + "?name=" + encodeURIComponent(val));
    if(res.ok){
      const data = await res.json();
      if(data && data.passed){
        state.reviewMode = true;
        state.priorRecord = data;
        state.screen = "reviewHome";
        render();
        return;
      }
    }
  } catch(e){ /* endpoint not deployed yet in local preview — fall through */ }
  state.reviewMode = false;
  state.screen = "section";
  state.sectionIndex = 0;
  render();
}

function renderReviewHome(){
  const card = document.createElement("div");
  card.className = "card";
  const rec = state.priorRecord || {};
  card.innerHTML = `
    <div class="welcome-back">
      <b>Welcome back, ${escapeHtml(state.name)}.</b> Our records show you already passed this course
      ${rec.date ? "on " + escapeHtml(rec.date) : ""}${rec.score ? " with a score of " + escapeHtml(String(rec.score)) + "%" : ""}.
      You're in <b>reference mode</b> — browse any section below and use the Reference Documents buttons to
      pull up the source manuals. No quiz required.
    </div>
    <h2>Sections</h2>
    <div class="section-nav">
      ${SECTIONS.map((s,i)=>`<span class="section-pill" style="cursor:pointer" onclick="goToReviewSection(${i})">${s.title}</span>`).join("")}
    </div>
    <p><button class="btn-secondary" id="retakeBtn">Retake the full test anyway</button></p>
  `;
  app.appendChild(card);
  document.getElementById("retakeBtn").onclick = ()=>{ state.reviewMode=false; state.screen="section"; state.sectionIndex=0; render(); };
}
window.goToReviewSection = function(i){
  state.sectionIndex = i;
  state.screen = "section";
  state.reviewOnly = true;
  render();
};

function renderSection(){
  const s = SECTIONS[state.sectionIndex];
  const card = document.createElement("div");
  card.className = "card";

  const pct = Math.round(((state.sectionIndex)/SECTIONS.length)*100);
  const nav = SECTIONS.map((sec,i)=>{
    let cls = "section-pill";
    if(state.sectionResults[sec.key]) cls += " done";
    if(i === state.sectionIndex) cls += " active";
    return `<span class="${cls}">${i+1}. ${sec.key}</span>`;
  }).join("");

  const refBtns = docsByIds(s.refs).map(d =>
    `<button class="btn-ref" onclick="openDoc('${d.id}')">📄 ${d.label}</button>`
  ).join("");

  card.innerHTML = `
    ${state.reviewOnly ? "" : `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`}
    <div class="section-nav">${nav}</div>
    <h2>${s.title}</h2>
    <div>${refBtns}</div>
    <div style="margin-top:16px;">${s.content}</div>
    <div id="quizArea" style="margin-top:24px;"></div>
    <div class="no-print" style="margin-top:20px;display:flex;gap:10px;">
      ${state.reviewOnly ? `<button class="btn-secondary" onclick="backToReviewHome()">Back to sections</button>` : ""}
    </div>
  `;
  app.appendChild(card);

  if(!state.reviewOnly){
    renderQuiz(s);
  }
}
window.backToReviewHome = function(){ state.screen="reviewHome"; render(); };

function renderQuiz(s){
  const quizArea = document.getElementById("quizArea");
  const already = state.sectionResults[s.key];
  const answers = new Array(s.quiz.length).fill(null);

  quizArea.innerHTML = `<h3>Knowledge Check</h3>` + s.quiz.map((q,qi)=>`
    <div class="quiz-q" data-qi="${qi}">
      <p><b>${qi+1}. ${q.q}</b></p>
      ${q.opts.map((o,oi)=>`<div class="quiz-opt" data-oi="${oi}" onclick="selectOpt(${qi},${oi})">${o}</div>`).join("")}
    </div>
  `).join("") + `
    <button class="btn-primary" id="submitQuizBtn" disabled>Submit Section</button>
    <div id="quizResult"></div>
  `;

  quizArea._answers = answers;

  document.getElementById("submitQuizBtn").onclick = () => submitQuiz(s);
}
window.selectOpt = function(qi, oi){
  const quizArea = document.getElementById("quizArea");
  quizArea._answers[qi] = oi;
  const qDiv = quizArea.querySelector(`.quiz-q[data-qi="${qi}"]`);
  qDiv.querySelectorAll(".quiz-opt").forEach(el=>el.classList.remove("selected"));
  qDiv.querySelector(`.quiz-opt[data-oi="${oi}"]`).classList.add("selected");
  const allAnswered = quizArea._answers.every(a=>a!==null);
  document.getElementById("submitQuizBtn").disabled = !allAnswered;
};

async function submitQuiz(s){
  const quizArea = document.getElementById("quizArea");
  const answers = quizArea._answers;
  let score = 0;
  s.quiz.forEach((q,qi)=>{
    const qDiv = quizArea.querySelector(`.quiz-q[data-qi="${qi}"]`);
    qDiv.querySelectorAll(".quiz-opt").forEach((el,oi)=>{
      if(oi === q.a) el.classList.add("correct");
      else if(oi === answers[qi]) el.classList.add("incorrect");
    });
    if(answers[qi] === q.a) score++;
  });
  const pct = score / s.quiz.length;
  const passed = pct >= PASS_THRESHOLD;
  state.sectionResults[s.key] = {score, total:s.quiz.length, passed};

  const resultDiv = document.getElementById("quizResult");
  resultDiv.innerHTML = `
    <div class="result-banner ${passed?'result-pass':'result-fail'}">
      You scored ${score}/${s.quiz.length} (${Math.round(pct*100)}%) — ${passed ? "Passed" : "Not yet passing (80% required)"}
    </div>
    <button class="btn-primary" id="nextBtn">${passed ? (state.sectionIndex < SECTIONS.length-1 ? "Next Section" : "Finish Course") : "Retry Section"}</button>
  `;
  document.getElementById("submitQuizBtn").style.display = "none";

  document.getElementById("nextBtn").onclick = async () => {
    if(!passed){ render(); return; }
    if(state.sectionIndex < SECTIONS.length - 1){
      state.sectionIndex++;
      render();
    } else {
      await finishCourse();
    }
  };
}

async function finishCourse(){
  const finalPct = totalScorePct();
  const passedAll = allSectionsPassed();
  state.finalScore = finalPct;
  state.finalPassed = passedAll;
  state.completionDate = new Date().toLocaleDateString();

  try{
    await fetch(RESULTS_ENDPOINT_RECORD, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        name: state.name,
        score: finalPct,
        passed: passedAll,
        date: state.completionDate,
        sectionResults: state.sectionResults
      })
    });
  } catch(e){ /* non-fatal if function not yet deployed */ }

  state.screen = "certificate";
  render();
}

function renderCertificate(){
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div id="certificate">
      <h1>Certificate of Completion</h1>
      <p>Bendix EC-80 / Fusion Troubleshooting Training</p>
      <p>This certifies that</p>
      <div class="name">${escapeHtml(state.name)}</div>
      <p>has successfully completed the course with a final score of <b>${state.finalScore}%</b></p>
      <p class="small">Completed: ${state.completionDate}</p>
      <p class="small">Andrews Logistics LP — Preventive Maintenance Training</p>
    </div>
    <div class="no-print" style="margin-top:20px;display:flex;gap:10px;">
      <button class="btn-primary" onclick="window.print()">Print / Save Certificate</button>
      <button class="btn-secondary" onclick="restartReview()">Return to course for reference</button>
    </div>
  `;
  app.appendChild(card);
}
window.restartReview = function(){
  state.reviewMode = true;
  state.priorRecord = {passed:true, score:state.finalScore, date:state.completionDate};
  state.screen = "reviewHome";
  render();
};

/* ---------------- DOC VIEWER ---------------- */
window.openDoc = function(id){
  const doc = REFERENCE_DOCS.find(d=>d.id===id);
  if(!doc) return;
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.onclick = (e)=>{ if(e.target===overlay) document.body.removeChild(overlay); };
  overlay.innerHTML = `
    <div class="modal-box">
      <button class="btn-secondary modal-close" onclick="this.closest('.modal-overlay').remove()">Close ✕</button>
      <h3>${doc.label}</h3>
      <iframe class="doc-embed" src="${doc.file}"></iframe>
      <p class="small">If the document doesn't display inline, <a href="${doc.file}" target="_blank">open it in a new tab</a>.</p>
    </div>
  `;
  document.body.appendChild(overlay);
};

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

render();
</script>
</body>
</html>
