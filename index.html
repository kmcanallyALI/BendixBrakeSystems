const RESULTS_ENDPOINT_CHECK = "/.netlify/functions/check-name";
const RESULTS_ENDPOINT_RECORD = "/.netlify/functions/record-result";
const CERTIFICATE_EMAIL_ENDPOINT = "/.netlify/functions/send-certificate";
const PASS_THRESHOLD = 0.8;
const QUIZ_SIZE = 6;          // how many questions are drawn per attempt from each section's pool
const MIN_READ_SECONDS = 40;  // minimum time on a content page before the knowledge check unlocks

function shuffleArray(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Builds one randomized attempt from a section's question pool: picks a random
// subset (so repeat attempts and different people don't see an identical quiz),
// and shuffles each question's answer order (so "the longest option" or
// "position C" is never a reliable shortcut).
function buildQuizInstance(pool){
  const chosen = shuffleArray(pool).slice(0, Math.min(QUIZ_SIZE, pool.length));
  return chosen.map(q => {
    const order = shuffleArray(q.opts.map((_, i) => i));
    return {
      q: q.q,
      opts: order.map(i => q.opts[i]),
      a: order.indexOf(q.a)
    };
  });
}

    <p>Before troubleshooting any Bendix electrical circuit, you need to be safe and accurate with a
    Digital Volt-Ohm-Milliammeter (DVOM). This section covers the ground rules and lets you practice on a
    simple circuit before you touch a real harness.</p>

    <h3>The three things you're measuring</h3>
    <table>
      <tr><th>Term</th><th>Symbol / Unit</th><th>Plain-language definition</th></tr>
      <tr><td><b>Volt</b></td><td>V</td><td>Electrical "pressure" — the force pushing current through a circuit. Measured across (in parallel with) two points.</td></tr>
      <tr><td><b>Amp</b></td><td>A</td><td>The rate of electrical flow — how much current is actually moving. Measured in series, in the path of the current itself.</td></tr>
      <tr><td><b>Ohm</b></td><td>Ω</td><td>Resistance — how much a component opposes current flow. Measured across a de-energized component.</td></tr>
    </table>

    <div class="fact-box"><b>Ohm's Law</b> ties all three together: <b>Volts = Amps × Ohms</b> (V = I × R).
    Know any two and you can calculate the third. A 12V circuit with a 4Ω load draws 3 amps
    (12 ÷ 4 = 3). If that same load only draws 1 amp, something's adding resistance somewhere
    (a bad connection, corrosion, a partially open circuit).
    </div>

    <div class="warn-box"><b>Never pierce a wire's insulation to take a reading.</b> A piercing probe (or
    a needle, paperclip, etc. jammed through the jacket) creates a pinhole that lets moisture and corrosion
    into the conductor. That corrosion spreads inside the insulation over time and causes an intermittent
    fault weeks or months later — one that's far harder to find than the one you were originally chasing.
    Always test at a proper connector, terminal, or back-probe point designed for it.</div>

    <div class="warn-box"><b>Don't force probes into a connector.</b> Jamming a meter probe into a sealed
    connector cavity can spread the female terminal or bend a male pin — creating a bad connection that
    didn't exist before you started testing. Use the factory back-probe location, a breakout harness, or
    test at an accessible splice — not by wedging a probe past the seal.</div>

    <h3>Practice: a simple light circuit</h3>
    <p>Below is a basic 12V circuit: a battery, a switch, and a lamp (the load), connected by wire. Four
    test points (A, B, C, D) sit at the connections between components. The switch is what energizes or
    de-energizes the circuit — closed sends power to the lamp, open cuts it off — but the battery itself
    always has 12V at its own terminals (A and D) whether the switch is open or closed, or even with nothing
    else connected. Select a meter function, then drag each probe onto a test point to take a reading. Try
    all three meter functions, and try opening and closing the switch to see how the readings change.</p>

/* ---------------- STATE ---------------- */
let state = {
  name: "",
  screen: "welcome",
  sectionIndex: 0,
  sectionResults: {}, // key -> {score, total, passed}
  practicalComplete: {}, // key -> true once that section's practical exercise is done
  gateRefresh: null, // set by the content-gate while mounted, so exercises can notify it of progress
  reviewMode: false,
  activeDoc: null
};

// Called by any practical-exercise widget once the trainee has successfully
// completed it. Reference-mode visits also call this (harmlessly) since the
// exercise is available there too, just never required.
function markPracticalComplete(key){
  state.practicalComplete[key] = true;
  if(typeof state.gateRefresh === "function") state.gateRefresh();
}


function totalScorePct(){
  let correct=0, total=0;
  SECTIONS.forEach(s=>{
    const r = state.sectionResults[s.key];
    if(r){ correct += r.score; total += r.total; }
  });
  return total ? Math.round((correct/total)*100) : 0;
}
function allSectionsPassed(){
  return SECTIONS.every(s => state.sectionResults[s.key] && state.sectionResults[s.key].passed);
}

/* ---------------- RENDER ---------------- */
const app = document.getElementById("app");

function render(){
  // Tear down any content-engagement gate (timer/observer) from a previous
  // screen before wiping the DOM, so it doesn't keep firing against removed elements.
  if(state.contentGateTimer){ clearInterval(state.contentGateTimer); state.contentGateTimer = null; }
  if(state.contentGateObserver){ state.contentGateObserver.disconnect(); state.contentGateObserver = null; }
  state.gateRefresh = null;

  app.innerHTML = "";
  if(state.screen === "welcome") return renderWelcome();
  if(state.screen === "reviewHome") return renderReviewHome();
  if(state.screen === "sectionContent") return renderSectionContent();
  if(state.screen === "sectionQuiz") return renderSectionQuiz();
  if(state.screen === "certificate") return renderCertificate();
}

function renderWelcome(){
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <h2>Welcome</h2>
    <p>This course covers troubleshooting the <b>Bendix ESP EC-80</b> controller — the system equipped on
    Andrews units — and the Bendix Fusion driver-assistance system (FLC-25 camera / FLR-25 radar),
    organized by troubleshooting topic rather than by document. It is not based on the base ABS/ATC
    controller, since that's not what's on our fleet.</p>
    <p>Enter your full legal name below. If you've already passed this course, you'll be dropped straight
    into <b>reference mode</b> so you can use it as a lookup tool without retaking the test.</p>
    <label><b>Full legal name</b></label>
    <input type="text" id="nameInput" placeholder="First Last" />
    <p style="margin-top:18px;">
      <button class="btn-primary" id="continueBtn">Continue</button>
    </p>
    <p id="lookupStatus" class="small"></p>
  `;
  app.appendChild(card);
  document.getElementById("continueBtn").onclick = onWelcomeContinue;
  document.getElementById("nameInput").addEventListener("keydown", e=>{ if(e.key==="Enter") onWelcomeContinue(); });
}

async function onWelcomeContinue(){
  const val = document.getElementById("nameInput").value.trim();
  const statusEl = document.getElementById("lookupStatus");
  if(!val){ statusEl.textContent = "Please enter your name to continue."; return; }
  state.name = val;
  statusEl.textContent = "Checking for prior completion...";
  try{
    const res = await fetch(RESULTS_ENDPOINT_CHECK + "?name=" + encodeURIComponent(val));
    if(res.ok){
      const data = await res.json();
      if(data && data.passed){
        state.reviewMode = true;
        state.priorRecord = data;
        state.screen = "reviewHome";
        render();
        return;
      }
    }
  } catch(e){ /* endpoint not deployed yet in local preview — fall through */ }
  state.reviewMode = false;
  state.screen = "sectionContent";
  state.sectionIndex = 0;
  render();
}

function renderReviewHome(){
  const card = document.createElement("div");
  card.className = "card";
  const rec = state.priorRecord || {};
  card.innerHTML = `
    <div class="welcome-back">
      <b>Welcome back, ${escapeHtml(state.name)}.</b> Our records show you already passed this course
      ${rec.date ? "on " + escapeHtml(rec.date) : ""}${rec.score ? " with a score of " + escapeHtml(String(rec.score)) + "%" : ""}.
      You're in <b>reference mode</b> — browse any section below and use the Reference Documents buttons to
      pull up the source manuals. No quiz required.
    </div>
    <h2>Sections</h2>
    <div class="section-nav">
      ${SECTIONS.map((s,i)=>`<span class="section-pill" style="cursor:pointer" onclick="goToReviewSection(${i})">${s.title}</span>`).join("")}
    </div>
    <p><button class="btn-secondary" id="retakeBtn">Retake the full test anyway</button></p>
  `;
  app.appendChild(card);
  document.getElementById("retakeBtn").onclick = ()=>{ state.reviewMode=false; state.screen="sectionContent"; state.sectionIndex=0; render(); };
}
window.goToReviewSection = function(i){
  state.sectionIndex = i;
  state.screen = "sectionContent";
  state.reviewOnly = true;
  render();
};

function sectionNavHtml(activeIndex, currentPageIsQuiz){
  return SECTIONS.map((sec,i)=>{
    let cls = "section-pill";
    if(state.sectionResults[sec.key]) cls += " done";
    if(i === activeIndex) cls += " active";
    return `<span class="${cls}">${i+1}. ${sec.key}</span>`;
  }).join("");
}

function renderSectionContent(){
  const s = SECTIONS[state.sectionIndex];
  const card = document.createElement("div");
  card.className = "card";

  const pct = Math.round(((state.sectionIndex)/SECTIONS.length)*100);
  const refBtns = docsByIds(s.refs).map(d =>
    `<button class="btn-ref" onclick="openDoc('${d.id}')">📄 ${d.label}</button>`
  ).join("");

  card.innerHTML = `
    ${state.reviewOnly ? "" : `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`}
    <div class="section-nav">${sectionNavHtml(state.sectionIndex)}</div>
    <h2>${s.title}</h2>
    <div>${refBtns}</div>
    <div id="sectionContentBody" style="margin-top:16px;">${s.content}</div>
    <div id="practicalRoot"></div>
    <div id="contentEndSentinel"></div>
    <div class="no-print" style="margin-top:24px;">
      ${state.reviewOnly
        ? `<button class="btn-secondary" onclick="backToReviewHome()">Back to sections</button>`
        : `<button class="btn-primary" id="toQuizBtn" disabled>Continue to Knowledge Check →</button>
           <p class="small" id="gateStatus" style="margin-top:8px;"></p>`
      }
    </div>
  `;
  app.appendChild(card);

  if(s.interactive === "dvom"){
    renderDvomWidget(document.getElementById("sectionContentBody"));
  }
  if(s.practical){
    renderPracticalExercise(document.getElementById("practicalRoot"), s);
  }

  if(!state.reviewOnly){
    setUpContentGate(s);
  }
}

// Requires a minimum dwell time, actually scrolling to the end of the section
// content, AND (when present) completing the practical exercise before
// "Continue to Knowledge Check" unlocks — so a trainee can't just click
// straight through every section without engaging with it. None of this
// applies in reference mode, where this button isn't shown at all.
function setUpContentGate(s){
  const toQuizBtn = document.getElementById("toQuizBtn");
  const gateStatus = document.getElementById("gateStatus");
  const sentinel = document.getElementById("contentEndSentinel");
  const needsPractical = !!s.practical || s.interactive === "dvom";

  let reachedEnd = false;
  let secondsLeft = MIN_READ_SECONDS;

  function updateStatus(){
    const practicalDone = !needsPractical || state.practicalComplete[s.key];
    if(reachedEnd && secondsLeft <= 0 && practicalDone){
      toQuizBtn.disabled = false;
      gateStatus.textContent = "";
      return;
    }
    toQuizBtn.disabled = true;
    const parts = [];
    if(secondsLeft > 0) parts.push(`${secondsLeft}s`);
    if(!reachedEnd) parts.push("scroll to the end of this section");
    if(needsPractical && !practicalDone) parts.push("complete the practical exercise below");
    gateStatus.textContent = "Review the material to continue — " + parts.join(" · ");
  }
  state.gateRefresh = updateStatus;
  updateStatus();

  state.contentGateTimer = setInterval(() => {
    if(secondsLeft > 0){
      secondsLeft--;
      updateStatus();
      if(secondsLeft <= 0){
        clearInterval(state.contentGateTimer);
        state.contentGateTimer = null;
      }
    }
  }, 1000);

  state.contentGateObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        reachedEnd = true;
        updateStatus();
      }
    });
  }, { threshold: 0.9 });
  state.contentGateObserver.observe(sentinel);

  toQuizBtn.onclick = () => {
    state.screen = "sectionQuiz";
    render();
  };
}
window.backToReviewHome = function(){ state.screen="reviewHome"; render(); };

function renderQuiz(s){
  const quizArea = document.getElementById("quizArea");
  const quizInstance = buildQuizInstance(s.quiz);
  const answers = new Array(quizInstance.length).fill(null);

  quizArea.innerHTML = `<h3>Knowledge Check</h3>` + quizInstance.map((q,qi)=>`
    <div class="quiz-q" data-qi="${qi}">
      <p><b>${qi+1}. ${q.q}</b></p>
      ${q.opts.map((o,oi)=>`<div class="quiz-opt" data-oi="${oi}" onclick="selectOpt(${qi},${oi})">${o}</div>`).join("")}
    </div>
  `).join("") + `
    <button class="btn-primary" id="submitQuizBtn" disabled>Submit Section</button>
    <div id="quizResult"></div>
  `;

  quizArea._answers = answers;
  quizArea._quiz = quizInstance;

  document.getElementById("submitQuizBtn").onclick = () => submitQuiz(s);
}
window.selectOpt = function(qi, oi){
  const quizArea = document.getElementById("quizArea");
  quizArea._answers[qi] = oi;
  const qDiv = quizArea.querySelector(`.quiz-q[data-qi="${qi}"]`);
  qDiv.querySelectorAll(".quiz-opt").forEach(el=>el.classList.remove("selected"));
  qDiv.querySelector(`.quiz-opt[data-oi="${oi}"]`).classList.add("selected");
  const allAnswered = quizArea._answers.every(a=>a!==null);
  document.getElementById("submitQuizBtn").disabled = !allAnswered;
};

async function submitQuiz(s){
  const quizArea = document.getElementById("quizArea");
  const quiz = quizArea._quiz;
  const answers = quizArea._answers;
  let score = 0;
  quiz.forEach((q,qi)=>{
    const qDiv = quizArea.querySelector(`.quiz-q[data-qi="${qi}"]`);
    qDiv.querySelectorAll(".quiz-opt").forEach((el,oi)=>{
      if(oi === q.a) el.classList.add("correct");
      else if(oi === answers[qi]) el.classList.add("incorrect");
    });
    if(answers[qi] === q.a) score++;
  });
  const pct = score / quiz.length;
  const passed = pct >= PASS_THRESHOLD;
  state.sectionResults[s.key] = {score, total:quiz.length, passed};

  const resultDiv = document.getElementById("quizResult");
  resultDiv.innerHTML = `
    <div class="result-banner ${passed?'result-pass':'result-fail'}">
      You scored ${score}/${quiz.length} (${Math.round(pct*100)}%) — ${passed ? "Passed" : "Not yet passing (80% required)"}
    </div>
    <button class="btn-primary" id="nextBtn">${passed ? (state.sectionIndex < SECTIONS.length-1 ? "Next Section" : "Finish Course") : "Retry Section"}</button>
  `;
  document.getElementById("submitQuizBtn").style.display = "none";

  document.getElementById("nextBtn").onclick = async () => {
    if(!passed){ state.screen = "sectionContent"; render(); return; }
    if(state.sectionIndex < SECTIONS.length - 1){
      state.sectionIndex++;
      state.screen = "sectionContent";
      render();
    } else {
      await finishCourse();
    }
  };
}

async function finishCourse(){
  const finalPct = totalScorePct();
  const passedAll = allSectionsPassed();
  state.finalScore = finalPct;
  state.finalPassed = passedAll;
  state.completionDate = new Date().toLocaleDateString();

  const resultPayload = {
    name: state.name,
    score: finalPct,
    passed: passedAll,
    date: state.completionDate,
    sectionResults: state.sectionResults
  };

  try{
    await fetch(RESULTS_ENDPOINT_RECORD, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(resultPayload)
    });
  } catch(e){ /* non-fatal if function not yet deployed */ }

  if(passedAll){
    try{
      await fetch(CERTIFICATE_EMAIL_ENDPOINT, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(resultPayload)
      });
    } catch(e){ /* non-fatal if function not yet deployed or email send fails */ }
  }

  state.screen = "certificate";
  render();
}

function initDvomWidget(root){
  const circuit = root.querySelector("#dvomCircuit");
  const tps = Array.from(root.querySelectorAll(".dvom-tp"));
  const tpB = tps.find(t => t.dataset.point === "B");
  const tpBIn = tps.find(t => t.dataset.point === "B_IN");
  const tpBOut = tps.find(t => t.dataset.point === "B_OUT");
  const gapCover = root.querySelector("#dvomGapCover");
  const gapLabel = root.querySelector("#dvomGapLabel");
  const instructions = root.querySelector("#dvomInstructions");
  const probeRed = root.querySelector("#dvomProbeRed");
  const probeBlack = root.querySelector("#dvomProbeBlack");
  const meterDisplay = root.querySelector("#dvomMeterDisplay");
  const noteEl = root.querySelector("#dvomNote");
  const switchBtn = root.querySelector("#dvomSwitchToggle");
  const switchIcon = root.querySelector("#dvomSwitchIcon");
  const modeBtns = Array.from(root.querySelectorAll(".dvom-mode-btn"));

  let mode = "V";
  let switchClosed = true;
  const assign = { red: null, black: null };
  const progress = { V: false, OHM: false, A: false };
  const checklistEl = root.querySelector("#dvomChecklist");

  function updateChecklist(){
    checklistEl.innerHTML =
      "Practical checklist: " +
      `<span style="color:${progress.V ? "var(--ok)" : "#888"};">${progress.V ? "✓" : "○"} Voltage</span> · ` +
      `<span style="color:${progress.OHM ? "var(--ok)" : "#888"};">${progress.OHM ? "✓" : "○"} Resistance</span> · ` +
      `<span style="color:${progress.A ? "var(--ok)" : "#888"};">${progress.A ? "✓" : "○"} Amps (in series)</span>`;
    if(progress.V && progress.OHM && progress.A){
      markPracticalComplete("dvom");
    }
  }
  updateChecklist();

  // starting tray positions (below the circuit, inside container coordinate space)
  const trayPositions = {
    red: { left: 220, top: 250 },
    black: { left: 400, top: 250 }
  };

  function placeProbe(el, left, top){
    el.style.left = left + "px";
    el.style.top = top + "px";
  }
  function resetProbes(){
    assign.red = null; assign.black = null;
    tps.forEach(t => t.classList.remove("filled"));
    placeProbe(probeRed, trayPositions.red.left, trayPositions.red.top);
    placeProbe(probeBlack, trayPositions.black.left, trayPositions.black.top);
  }
  resetProbes();

  function updateCircuitForMode(){
    const isAmps = mode === "A";
    // In Amps mode, point B is replaced by a visible break (B_IN / B_OUT) that the
    // meter must be inserted into, in series, to complete the circuit.
    tpB.style.display = isAmps ? "none" : "flex";
    tpBIn.style.display = isAmps ? "flex" : "none";
    tpBOut.style.display = isAmps ? "flex" : "none";
    gapCover.style.display = isAmps ? "block" : "none";
    gapLabel.style.display = isAmps ? "block" : "none";
    instructions.textContent = isAmps
      ? "The circuit has been opened between the switch and the lamp. Drag the RED probe to IN (the source side) and the BLACK probe to OUT (the load side) to connect the meter in series — this is the only way to correctly measure Amps."
      : "Drag the probes above onto test points A–D. Red = V/Ω/A lead, Black = COM (ground) lead.";
  }

  function nodeVoltage(node){
    // The battery itself always has 12V at its own terminals (A and D) — that's true
    // whether the switch is open or closed, even with no circuit connected at all.
    if(node === "A") return 12;
    if(node === "D") return 0;
    if(node === "C") return 0;
    // Point B only sees battery voltage once the switch is closed and current can flow there.
    if(node === "B") return switchClosed ? 12 : 0;
  }

  function resistanceBetween(p1, p2){
    const key = [p1,p2].sort().join("");
    const OL = Infinity;
    const table = {
      "AB": switchClosed ? 0 : OL,
      "BC": 4,
      "CD": 0,
      "AC": switchClosed ? 4 : OL,
      "BD": 4,
      "AD": switchClosed ? 4 : OL
    };
    return table[key];
  }

  function updateModeButtons(){
    modeBtns.forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  }
  modeBtns.forEach(b => b.onclick = () => {
    mode = b.dataset.mode;
    updateModeButtons();
    updateCircuitForMode();
    resetProbes(); // leads get repositioned for each new kind of test, same as in the field
    evaluate();
  });

  switchBtn.onclick = () => {
    switchClosed = !switchClosed;
    switchBtn.textContent = "Switch: " + (switchClosed ? "CLOSED" : "OPEN");
    switchBtn.className = "dvom-toggle " + (switchClosed ? "on" : "off");
    switchIcon.style.background = switchClosed ? "#2e7d4f" : "#888";
    switchIcon.textContent = switchClosed ? "SWITCH (closed)" : "SWITCH (open)";
    evaluate();
  };

  function nearestTestPoint(clientX, clientY){
    const rect = circuit.getBoundingClientRect();
    let best = null, bestDist = 26; // px snap threshold
    tps.forEach(tp => {
      if(getComputedStyle(tp).display === "none") return; // skip points not active in current mode
      const tRect = tp.getBoundingClientRect();
      const tx = tRect.left + tRect.width/2, ty = tRect.top + tRect.height/2;
      const d = Math.hypot(clientX - tx, clientY - ty);
      if(d < bestDist){ bestDist = d; best = tp; }
    });
    return best;
  }

  function makeDraggable(el, colorKey){
    el.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      const rect = circuit.getBoundingClientRect();

      function onMove(ev){
        const left = ev.clientX - rect.left;
        const top = ev.clientY - rect.top;
        placeProbe(el, left, top);
      }
      function onUp(ev){
        el.removeEventListener("pointermove", onMove);
        el.removeEventListener("pointerup", onUp);
        const tp = nearestTestPoint(ev.clientX, ev.clientY);
        tps.forEach(t => t.classList.remove("filled"));
        if(tp){
          const tRect = tp.getBoundingClientRect();
          placeProbe(el, tRect.left - rect.left + tRect.width/2, tRect.top - rect.top + tRect.height/2);
          assign[colorKey] = tp.dataset.point;
          tp.classList.add("filled");
        } else {
          placeProbe(el, trayPositions[colorKey].left, trayPositions[colorKey].top);
          assign[colorKey] = null;
        }
        // re-mark filled for the other probe's point too
        const otherKey = colorKey === "red" ? "black" : "red";
        if(assign[otherKey]){
          const otherTp = tps.find(t => t.dataset.point === assign[otherKey]);
          if(otherTp) otherTp.classList.add("filled");
        }
        evaluate();
      }
      el.addEventListener("pointermove", onMove);
      el.addEventListener("pointerup", onUp);
    });
  }
  makeDraggable(probeRed, "red");
  makeDraggable(probeBlack, "black");

  function setNote(text, isWarn){
    noteEl.textContent = text;
    noteEl.className = "dvom-note" + (isWarn ? " warn" : "");
  }

  function evaluate(){
    const p1 = assign.red, p2 = assign.black;
    if(!p1 || !p2){
      meterDisplay.textContent = "-- . -";
      setNote("Select a meter function and drag both probes onto test points to take a reading.", false);
      return;
    }
    if(p1 === p2){
      meterDisplay.textContent = "0.0";
      setNote("Both probes are on the same point — no difference to measure. Try two different test points.", false);
      return;
    }

    if(mode === "V"){
      const v = Math.abs(nodeVoltage(p1) - nodeVoltage(p2));
      meterDisplay.textContent = v.toFixed(1) + " V";
      const pair = [p1,p2].sort().join("");
      let note = "Voltage reading between " + p1 + " and " + p2 + ".";
      if(pair === "AB") note = switchClosed
        ? "0.0V across a CLOSED switch — a good switch has no voltage drop."
        : "12.0V across an OPEN switch — full battery voltage appears across an open point in the circuit. Classic sign of an open switch or connection.";
      if(pair === "BC") note = switchClosed
        ? "12.0V across the lamp — this is where the electrical energy is being used to do work (light the lamp)."
        : "0.0V across the lamp — the switch is open, so no current is flowing and there's nothing for the lamp to drop.";
      if(pair === "CD") note = "0.0V across plain wire — good wire has essentially no resistance, so no voltage drop.";
      if(pair === "AD") note = "12.0V — the battery has 12V at its own terminals whether the switch is open or closed. A battery by itself, with no circuit connected at all, still reads full voltage here.";
      setNote(note, false);
      progress.V = true;
      updateChecklist();
    } else if(mode === "OHM"){
      if(switchClosed){
        meterDisplay.textContent = "-OL-";
        setNote("⚠ Never measure resistance on an energized circuit — open the switch first to de-energize it, or you can damage the meter and get a false reading.", true);
        return;
      }
      const r = resistanceBetween(p1, p2);
      if(r === Infinity){
        meterDisplay.textContent = "O.L";
        setNote("Open circuit (infinite resistance) — with the switch open, there's no continuous path between these points. This is exactly how you'd find an open switch or a broken wire.", false);
      } else {
        meterDisplay.textContent = r.toFixed(1) + " Ω";
        const pair = [p1,p2].sort().join("");
        let note = "Resistance reading between " + p1 + " and " + p2 + ".";
        if(pair === "BC") note = "4.0Ω — this is the lamp's own resistance.";
        if(pair === "CD") note = "0.0Ω — plain wire, essentially no resistance.";
        if(pair === "AD" || pair === "AC") note = "Total resistance through the switch and lamp in this path.";
        setNote(note, false);
        progress.OHM = true;
        updateChecklist();
      }
    } else if(mode === "A"){
      const pair = [p1,p2].sort().join("");
      const isSeriesPair = pair === ["B_IN","B_OUT"].sort().join("");
      if(!isSeriesPair){
        meterDisplay.textContent = "-FUSE-";
        setNote("⚠ Blown fuse! You connected the meter across two points like a voltmeter while set to Amps. An ammeter has almost no resistance, so bridging two points this way creates a dead short. To measure current correctly, the circuit has been broken open between the switch and the lamp — insert the meter IN SERIES at IN/OUT.", true);
        return;
      }
      if(!switchClosed){
        meterDisplay.textContent = "0.0 A";
        setNote("Meter correctly connected in series — but the switch is open, so the circuit is de-energized and no current is flowing.", false);
        progress.A = true;
        updateChecklist();
        return;
      }
      // Correct polarity: current flows A -> switch -> IN -> (through meter) -> OUT -> lamp -> D.
      // Red (V/Ω/A) lead should be on the upstream/source side (IN); black (COM) on the downstream/load side (OUT).
      const correctPolarity = assign.red === "B_IN" && assign.black === "B_OUT";
      const amps = 12 / 4; // Ohm's Law: 12V battery / 4Ω lamp
      meterDisplay.textContent = (correctPolarity ? amps.toFixed(1) : "-" + amps.toFixed(1)) + " A";
      setNote(correctPolarity
        ? "3.0A — correct! The switch is closed (circuit energized). This is Ohm's Law in action: 12V ÷ 4Ω = 3A. The meter is in series, so all the circuit's current flows through it."
        : "Reading shows -3.0A. The meter is correctly in series and the current value is right, but the leads are reversed — red (V/Ω/A) should be on the source/upstream side, black (COM) on the load/downstream side.", false);
      progress.A = true;
      updateChecklist();
    }
  }

  updateModeButtons();
  updateCircuitForMode();
  evaluate();

  // Reposition probes correctly if the window resizes (keeps them anchored to their point/tray).
  window.addEventListener("resize", () => {
    ["red","black"].forEach(key => {
      const el = key === "red" ? probeRed : probeBlack;
      if(assign[key]){
        const tp = tps.find(t => t.dataset.point === assign[key]);
        if(tp){
          const rect = circuit.getBoundingClientRect();
          const tRect = tp.getBoundingClientRect();
          placeProbe(el, tRect.left - rect.left + tRect.width/2, tRect.top - rect.top + tRect.height/2);
          return;
        }
      }
      placeProbe(el, trayPositions[key].left, trayPositions[key].top);
    });
  });
}

/* ---------------- PRACTICAL EXERCISE DISPATCHER ---------------- */
function renderPracticalExercise(container, section){
  const p = section.practical;
  const wrap = document.createElement("div");
  wrap.style.cssText = "margin-top:20px;";
  wrap.innerHTML = `
    <style>
      .pex-box{background:#fafcff;border:2px solid #d5dfe8;border-radius:10px;padding:16px;}
      .pex-item{background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px 16px;margin-bottom:12px;}
      .pex-item.solved{border-color:var(--ok);background:#f3fbf5;}
      .pex-verdict-btns{display:flex;gap:10px;margin-top:10px;}
      .pex-verdict-btn{flex:1;padding:10px;border-radius:6px;border:2px solid #ccc;background:#fff;font-weight:600;cursor:pointer;}
      .pex-verdict-btn.correct{border-color:var(--ok);background:#e6f6ec;color:var(--ok);}
      .pex-verdict-btn.incorrect{border-color:var(--bad);background:#fbeceb;color:var(--bad);}
      .pex-explain{margin-top:8px;font-size:.88rem;color:#333;background:#eef4fb;padding:8px 10px;border-radius:6px;}
      .pex-progress{font-weight:600;color:var(--navy);margin-bottom:10px;}
      .pex-lamp{width:34px;height:34px;border-radius:50%;background:#333;display:inline-block;margin:0 8px -8px 0;transition:background .1s;}
      .pex-lamp.on{background:#ffd54a;box-shadow:0 0 12px 4px rgba(255,213,74,.8);}
    </style>
    <div class="pex-box">
      <h3 style="margin-top:0;">Practical Exercise${p.title ? ": " + escapeHtml(p.title) : ""}</h3>
      ${p.intro ? `<p>${p.intro}</p>` : ""}
      <div id="pexBody"></div>
    </div>
  `;
  container.appendChild(wrap);

  if(p.type === "judgment") initJudgmentExercise(wrap, section);
  else if(p.type === "blinkDecoder") initBlinkDecoder(wrap, section);
}

/* --- Judgment exercise: trainee classifies each item using two verdict
   buttons (labels configurable per section). Used for meter-reading
   diagnosis, scenario judgment calls, and spot-the-violation checks. --- */
function initJudgmentExercise(wrap, section){
  const p = section.practical;
  const body = wrap.querySelector("#pexBody");
  const solved = new Set();

  function render(){
    body.innerHTML = `<div class="pex-progress">Progress: ${solved.size} / ${p.items.length} correct</div>` +
      p.items.map((item, idx) => {
        const isSolved = solved.has(idx);
        return `
          <div class="pex-item${isSolved ? " solved" : ""}" data-idx="${idx}">
            <div>${item.prompt}</div>
            <div class="pex-verdict-btns">
              <button class="pex-verdict-btn" data-idx="${idx}" data-choice="0" ${isSolved ? "disabled" : ""}>${p.verdictLabels[0]}</button>
              <button class="pex-verdict-btn" data-idx="${idx}" data-choice="1" ${isSolved ? "disabled" : ""}>${p.verdictLabels[1]}</button>
            </div>
            <div class="pex-feedback"></div>
          </div>
        `;
      }).join("");

    body.querySelectorAll(".pex-verdict-btn").forEach(btn => {
      btn.onclick = () => {
        const idx = Number(btn.dataset.idx);
        const choice = Number(btn.dataset.choice);
        const item = p.items[idx];
        const itemDiv = body.querySelector(`.pex-item[data-idx="${idx}"]`);
        const feedback = itemDiv.querySelector(".pex-feedback");
        if(choice === item.correct){
          btn.classList.add("correct");
          feedback.innerHTML = `<div class="pex-explain">✓ Correct. ${item.explanation}</div>`;
          itemDiv.querySelectorAll(".pex-verdict-btn").forEach(b => b.disabled = true);
          solved.add(idx);
          itemDiv.classList.add("solved");
          body.querySelector(".pex-progress").textContent = `Progress: ${solved.size} / ${p.items.length} correct`;
          if(solved.size === p.items.length){
            markPracticalComplete(section.key);
            body.insertAdjacentHTML("afterbegin", `<div class="result-banner result-pass" style="margin-bottom:14px;">Practical exercise complete!</div>`);
          }
        } else {
          btn.classList.add("incorrect");
          feedback.innerHTML = `<div class="pex-explain">Not quite — try the other option.</div>`;
          setTimeout(() => btn.classList.remove("incorrect"), 700);
        }
      };
    });
  }
  render();
}

/* --- Blink decoder: plays an animated lamp sequence for each trial; the
   trainee reads the blink groups and picks what the code was, then sees
   its meaning once correct. Mirrors reading a real ABS blink code. --- */
function initBlinkDecoder(wrap, section){
  const p = section.practical;
  const body = wrap.querySelector("#pexBody");
  const solved = new Set();
  let currentTrial = 0;

  function playSequence(groups, lampEl, onDone){
    let seq = [];
    groups.forEach((count, gi) => {
      for(let b = 0; b < count; b++){ seq.push("on"); seq.push("off"); }
      if(gi < groups.length - 1) seq.push("pause");
    });
    let i = 0;
    function step(){
      if(i >= seq.length){ onDone(); return; }
      const t = seq[i];
      lampEl.classList.toggle("on", t === "on");
      i++;
      setTimeout(step, t === "pause" ? 500 : 300);
    }
    step();
  }

  function render(){
    if(currentTrial >= p.trials.length){
      body.innerHTML = `<div class="result-banner result-pass">Practical exercise complete!</div>`;
      markPracticalComplete(section.key);
      return;
    }
    const trial = p.trials[currentTrial];
    body.innerHTML = `
      <div class="pex-progress">Trial ${currentTrial + 1} of ${p.trials.length}</div>
      <div class="pex-item">
        <p><span class="pex-lamp" id="blinkLamp"></span> <button class="btn-secondary" id="playBlinkBtn">▶ Play blink sequence</button></p>
        <p class="small">Watch the lamp, count the blinks in each group, then choose the code you read.</p>
        <div id="blinkOptions" style="margin-top:10px;"></div>
        <div class="pex-feedback"></div>
      </div>
    `;
    const lamp = body.querySelector("#blinkLamp");
    body.querySelector("#playBlinkBtn").onclick = () => playSequence(trial.code, lamp, () => {});

    const optionsDiv = body.querySelector("#blinkOptions");
    optionsDiv.innerHTML = trial.options.map((opt, oi) =>
      `<div class="quiz-opt" data-oi="${oi}">${opt}</div>`
    ).join("");
    optionsDiv.querySelectorAll(".quiz-opt").forEach(el => {
      el.onclick = () => {
        const oi = Number(el.dataset.oi);
        const feedback = body.querySelector(".pex-feedback");
        if(oi === trial.correct){
          el.classList.add("correct");
          feedback.innerHTML = `<div class="pex-explain">✓ Correct — ${trial.meaning}</div>`;
          optionsDiv.querySelectorAll(".quiz-opt").forEach(o => o.onclick = null);
          const nextBtn = document.createElement("button");
          nextBtn.className = "btn-primary";
          nextBtn.style.marginTop = "10px";
          nextBtn.textContent = currentTrial < p.trials.length - 1 ? "Next trial" : "Finish exercise";
          nextBtn.onclick = () => { currentTrial++; render(); };
          feedback.appendChild(nextBtn);
        } else {
          el.classList.add("incorrect");
          setTimeout(() => el.classList.remove("incorrect"), 700);
        }
      };
    });
  }
  render();
}

/* ---------------- DOC VIEWER ---------------- */
window.openDoc = function(id){
  const doc = REFERENCE_DOCS.find(d=>d.id===id);
  if(!doc) return;
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.onclick = (e)=>{ if(e.target===overlay) document.body.removeChild(overlay); };
  overlay.innerHTML = `
    <div class="modal-box">
      <button class="btn-secondary modal-close" onclick="this.closest('.modal-overlay').remove()">Close ✕</button>
      <h3>${doc.label}</h3>
      <iframe class="doc-embed" src="${doc.file}"></iframe>
      <p class="small">If the document doesn't display inline, <a href="${doc.file}" target="_blank">open it in a new tab</a>.</p>
    </div>
  `;
  document.body.appendChild(overlay);
};

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

render();
