<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bendix EC-80 / Fusion Troubleshooting Training — Andrews Logistics</title>
<style>
  :root{
    --navy:#0b2545; --blue:#1560bd; --amber:#e8a628; --gray:#f4f6f8;
    --text:#1a1f27; --ok:#1e8f4e; --bad:#c23a2e;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--gray);color:var(--text);}
  header{background:var(--navy);color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;}
  header h1{font-size:1.15rem;margin:0;}
  header .badge{background:var(--amber);color:#1a1f27;padding:4px 10px;border-radius:4px;font-size:.8rem;font-weight:600;}
  #app{max-width:880px;margin:0 auto;padding:28px 20px 80px;}
  .card{background:#fff;border-radius:10px;padding:28px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:20px;}
  h2{color:var(--navy);margin-top:0;}
  h3{color:var(--blue);}
  button{cursor:pointer;border:none;border-radius:6px;padding:12px 22px;font-size:1rem;font-weight:600;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:disabled{background:#9db6d0;cursor:not-allowed;}
  .btn-secondary{background:#e2e8ef;color:var(--navy);}
  .btn-ref{background:#fff;color:var(--blue);border:2px solid var(--blue);padding:8px 14px;font-size:.9rem;margin:4px 6px 4px 0;}
  .btn-ref:hover{background:var(--blue);color:#fff;}
  input[type=text]{width:100%;padding:12px;font-size:1rem;border:1px solid #ccc;border-radius:6px;}
  .progress-bar{height:8px;background:#e2e8ef;border-radius:4px;overflow:hidden;margin-bottom:24px;}
  .progress-fill{height:100%;background:var(--blue);transition:width .3s;}
  .section-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .section-pill{padding:6px 12px;border-radius:20px;background:#e2e8ef;font-size:.8rem;color:var(--navy);}
  .section-pill.done{background:var(--ok);color:#fff;}
  .section-pill.active{background:var(--blue);color:#fff;}
  .fact-box{background:#eef4fb;border-left:4px solid var(--blue);padding:12px 16px;margin:14px 0;border-radius:4px;}
  .warn-box{background:#fdecea;border-left:4px solid var(--bad);padding:12px 16px;margin:14px 0;border-radius:4px;}
  table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.92rem;}
  th,td{border:1px solid #ddd;padding:8px;text-align:left;}
  th{background:#eef2f6;}
  .quiz-q{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #eee;}
  .quiz-opt{display:block;margin:6px 0;padding:10px 12px;border:1px solid #ccc;border-radius:6px;cursor:pointer;}
  .quiz-opt:hover{background:#f0f4f9;}
  .quiz-opt.selected{border-color:var(--blue);background:#e8f0fb;}
  .quiz-opt.correct{border-color:var(--ok);background:#e6f6ec;}
  .quiz-opt.incorrect{border-color:var(--bad);background:#fbeceb;}
  .result-banner{padding:16px;border-radius:8px;font-weight:600;margin-bottom:16px;}
  .result-pass{background:#e6f6ec;color:var(--ok);}
  .result-fail{background:#fbeceb;color:var(--bad);}
  .doc-embed{width:100%;height:75vh;border:1px solid #ccc;border-radius:6px;margin-top:12px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;}
  .modal-box{background:#fff;border-radius:10px;padding:20px;max-width:1000px;width:100%;max-height:92vh;overflow:auto;}
  .modal-close{float:right;}
  #certificate{background:#fffdf6;border:10px double var(--navy);padding:50px;text-align:center;}
  #certificate h1{color:var(--navy);font-size:2rem;margin-bottom:0;}
  #certificate .name{font-size:1.8rem;color:var(--blue);margin:18px 0;border-bottom:2px solid var(--amber);display:inline-block;padding-bottom:6px;}
  .small{font-size:.85rem;color:#555;}
  .welcome-back{background:#eef8ee;border:1px solid var(--ok);padding:16px;border-radius:8px;margin-bottom:16px;}
  @media print{
    header,.no-print{display:none !important;}
    body{background:#fff;}
  }
</style>

{
  key:"dvom",
  title:"1. DVOM Basics: Safe & Accurate Electrical Testing",
  refs:[],
  interactive:"dvom",
  content:`
    <p>Before troubleshooting any Bendix electrical circuit, you need to be safe and accurate with a
    Digital Volt-Ohm-Milliammeter (DVOM). This section covers the ground rules and lets you practice on a
    simple circuit before you touch a real harness.</p>

    <h3>The three things you're measuring</h3>
    <table>
      <tr><th>Term</th><th>Symbol / Unit</th><th>Plain-language definition</th></tr>
      <tr><td><b>Volt</b></td><td>V</td><td>Electrical "pressure" — the force pushing current through a circuit. Measured across (in parallel with) two points.</td></tr>
      <tr><td><b>Amp</b></td><td>A</td><td>The rate of electrical flow — how much current is actually moving. Measured in series, in the path of the current itself.</td></tr>
      <tr><td><b>Ohm</b></td><td>Ω</td><td>Resistance — how much a component opposes current flow. Measured across a de-energized component.</td></tr>
    </table>

    <div class="fact-box"><b>Ohm's Law</b> ties all three together: <b>Volts = Amps × Ohms</b> (V = I × R).
    Know any two and you can calculate the third. A 12V circuit with a 4Ω load draws 3 amps
    (12 ÷ 4 = 3). If that same load only draws 1 amp, something's adding resistance somewhere
    (a bad connection, corrosion, a partially open circuit).
    </div>

    <div class="warn-box"><b>Never pierce a wire's insulation to take a reading.</b> A piercing probe (or
    a needle, paperclip, etc. jammed through the jacket) creates a pinhole that lets moisture and corrosion
    into the conductor. That corrosion spreads inside the insulation over time and causes an intermittent
    fault weeks or months later — one that's far harder to find than the one you were originally chasing.
    Always test at a proper connector, terminal, or back-probe point designed for it.</div>

    <div class="warn-box"><b>Don't force probes into a connector.</b> Jamming a meter probe into a sealed
    connector cavity can spread the female terminal or bend a male pin — creating a bad connection that
    didn't exist before you started testing. Use the factory back-probe location, a breakout harness, or
    test at an accessible splice — not by wedging a probe past the seal.</div>

    <h3>Practice: a simple light circuit</h3>
    <p>Below is a basic 12V circuit: a battery, a switch, and a lamp (the load), connected by wire. Four
    test points (A, B, C, D) sit at the connections between components. Select a meter function, then drag
    each probe onto a test point to take a reading. Try all three meter functions, and try the switch and
    power toggles to see how the readings change.</p>
    <div id="dvomWidgetRoot"></div>
  `,
  quiz:[
    {q:"What does a Volt measure?",
     opts:["The rate of current flow","Electrical pressure/force pushing current through a circuit","Resistance to current flow","The size of a wire"], a:1},
    {q:"What does an Amp measure?",
     opts:["Electrical pressure","The rate of electrical current flow","Resistance","Wire insulation thickness"], a:1},
    {q:"What does an Ohm measure?",

    {q:"According to Ohm's Law, if a 12V circuit has a 4Ω load, how many amps will it draw?",
     opts:["1 amp","3 amps","8 amps","48 amps"], a:1},
    {q:"Why should you never pierce a wire's insulation to take a meter reading?",
     opts:["It's slower than other methods","It lets moisture and corrosion into the conductor, causing a future intermittent fault","It voids the DVOM warranty","Piercing tools are expensive"], a:1},
    {q:"Why shouldn't you force a meter probe into a sealed connector cavity?",
     opts:["It can spread the female terminal or bend a male pin, creating a new bad connection","It will trip a circuit breaker","It discharges the battery","It's against OSHA rules"], a:0},
    {q:"To measure current (Amps) correctly, the meter must be connected:",

    {q:"To measure resistance (Ohms) correctly, the circuit should be:",
     opts:["Fully powered and under load","De-energized (power disconnected)","Running at high RPM","Submerged in water"], a:1}
  ]

{

  content:`
    <p>Blink codes let you troubleshoot without a laptop. The ABS indicator lamp blinks two-digit code
    groups; record each group and look it up in the DTC index.</p>
    <table>
      <tr><th>Switch presses</th><th>Mode entered</th></tr>
      <tr><td>1</td><td>Active DTC retrieval</td></tr>
      <tr><td>2</td><td>Inactive DTC retrieval</td></tr>
      <tr><td>3</td><td>Clear active DTCs</td></tr>
      <tr><td>4</td><td>System configuration check</td></tr>
      <tr><td>5</td><td>Dynamometer Test Mode</td></tr>
      <tr><td>7 (held before power-up)</td><td>Reconfigure ECU</td></tr>
    </table>
    <div class="fact-box"><b>System Configuration Check on ESP units is a 7-digit sequence</b> (one digit
    longer than plain ABS/ATC controllers), because it includes a 7th number for Stability Configuration:
    <b>1 = No Stability Program, 2 = Electronic Stability Program (ESP)</b>. The other six digits cover
    system voltage, wheel speed sensor count, PMV count, ABS configuration, traction control configuration,
    and retarder configuration, in that order.</div>
    <div class="warn-box"><b>Dynamometer Test Mode on ESP units disables more than on plain ABS/ATC:</b> it

    Fusion/Wingman-equipped vehicle.</div>

    take down the whole serial link, sometimes intermittently, logging multiple DTCs across several

    <div class="fact-box"><b>Camera calibration:</b> after replacement, allow up to 20 minutes of driving

    drive above 30 mph (typically 15–60 minutes) with ACom monitoring until it reports "Alignment
    Successful."</div>
    <p>Common false-troubleshooting trap: a "false brake application" reported by a driver is often actually
    a loss of engine throttle from a J1939 communication failure — frequently caused by aftermarket
    Electronic Driver Logs, GPS, or telematics devices tapped into the CAN line.</p>
    <p>Remember the dependency chain from Section 1: Fusion will not operate, and will set its own DTC, if
    the ESP EC-80 controller (or engine, transmission, cruise, or instrument cluster) already has an active
    DTC. Clear the ESP-tier DTCs first.</p>
  `,
  quiz:[
    {q:"What voltage should you expect at the FLC-25 camera's Module Power pin (pin 7) to ground, under load?",
     opts:["5–9 VDC","10–16 VDC","12–24 VDC","0–5 VDC"], a:1},
    {q:"Can the FLR-25 radar sensor be repositioned from its original OEM mounting location?",
     opts:["Yes, anywhere on the bumper", "No — it must stay in the original OEM location; repositioning requires reprogramming the mounting offset", "Only if it's centered", "Only with a dealer waiver"], a:1},
    {q:"After replacing a camera, how long might calibration take before you should suspect a real fault?",
     opts:["Up to 20 minutes of driving above 25 mph","5 seconds","It calibrates instantly at power-up","Only after a full oil change interval"], a:0},
    {q:"A driver reports unexplained loss of engine power they interpreted as a 'false brake event.' What should you suspect first?",
     opts:["A cracked windshield","A J1939 communication failure, often from an aftermarket EDL, GPS, or telematics device","A flat tire","Low coolant"], a:1},
    {q:"On an Andrews (ESP-tier) unit, what will block the Fusion system from operating even if the radar and camera are perfectly healthy?",
     opts:["Cold weather","An active DTC on the ESP EC-80 controller, engine, transmission, cruise, or instrument cluster","Driving over 55 mph","Using cruise control"], a:1}
  ]
},
{
  key:"wiring",
  title:"7. Wiring, Harnesses & Connectors",
  refs:["esp","camera","radar"],
  content:`
    <p>Most intermittent ESP and Fusion faults trace back to connectors and harness routing, not the
    controller itself — this is even more true on ESP units, which have a fourth connector (X4) and four
    extra stability-sensor circuits to keep clean.</p>
    <ul>
      <li>All wire harness connectors must be fully seated — push until they click/seal, and use secondary
      locks where provided.</li>
      <li>Unused ECU connectors (including a secured, no-longer-used X4 on a downgraded ESP-to-ATC
      controller swap) must be capped and protected from moisture at all times.</li>
      <li>Sensor and J1939 circuits must use twisted-pair wire (1–2 twists per inch).</li>
      <li>Route wires straight out of a connector for at least 3 inches before any bend.</li>
      <li>Secure wiring every 6–12 inches with UV-stabilized, non-metallic clamps or bow-tie ties — never
      standard tie-wraps directly on rubber air lines (pressure cycling can chafe through the wire jacket).</li>
      <li>Corroded connector terminals on a camera, radar, SAS, or YRS usually mean water intrusion —

/* ---------------- STATE ---------------- */
let state = {
  name: "",
  screen: "welcome",
  sectionIndex: 0,
  sectionResults: {}, // key -> {score, total, passed}
  reviewMode: false,
  activeDoc: null
};

function totalScorePct(){
  let correct=0, total=0;
  SECTIONS.forEach(s=>{
    const r = state.sectionResults[s.key];
    if(r){ correct += r.score; total += r.total; }
  });
  return total ? Math.round((correct/total)*100) : 0;
}
function allSectionsPassed(){
  return SECTIONS.every(s => state.sectionResults[s.key] && state.sectionResults[s.key].passed);
}

/* ---------------- RENDER ---------------- */
const app = document.getElementById("app");

function render(){
  app.innerHTML = "";
  if(state.screen === "welcome") return renderWelcome();
  if(state.screen === "reviewHome") return renderReviewHome();
  if(state.screen === "sectionContent") return renderSectionContent();
  if(state.screen === "sectionQuiz") return renderSectionQuiz();
  if(state.screen === "certificate") return renderCertificate();
}

function renderWelcome(){
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `

    Andrews units — and the Bendix Fusion driver-assistance system (FLC-25 camera / FLR-25 radar),
    organized by troubleshooting topic rather than by document. It is not based on the base ABS/ATC

async function onWelcomeContinue(){
  const val = document.getElementById("nameInput").value.trim();
  const statusEl = document.getElementById("lookupStatus");
  if(!val){ statusEl.textContent = "Please enter your name to continue."; return; }
  state.name = val;
  statusEl.textContent = "Checking for prior completion...";
  try{
    const res = await fetch(RESULTS_ENDPOINT_CHECK + "?name=" + encodeURIComponent(val));
    if(res.ok){
      const data = await res.json();
      if(data && data.passed){

        state.priorRecord = data;
        state.screen = "reviewHome";

      }

function renderQuiz(s){
  const quizArea = document.getElementById("quizArea");
  const already = state.sectionResults[s.key];
  const answers = new Array(s.quiz.length).fill(null);

  quizArea.innerHTML = `<h3>Knowledge Check</h3>` + s.quiz.map((q,qi)=>`
    <div class="quiz-q" data-qi="${qi}">
      <p><b>${qi+1}. ${q.q}</b></p>
      ${q.opts.map((o,oi)=>`<div class="quiz-opt" data-oi="${oi}" onclick="selectOpt(${qi},${oi})">${o}</div>`).join("")}
    </div>
  `).join("") + `
    <button class="btn-primary" id="submitQuizBtn" disabled>Submit Section</button>
    <div id="quizResult"></div>
  `;

  quizArea._answers = answers;

  document.getElementById("submitQuizBtn").onclick = () => submitQuiz(s);
}
window.selectOpt = function(qi, oi){
  const quizArea = document.getElementById("quizArea");
  quizArea._answers[qi] = oi;
  const qDiv = quizArea.querySelector(`.quiz-q[data-qi="${qi}"]`);
  qDiv.querySelectorAll(".quiz-opt").forEach(el=>el.classList.remove("selected"));
  qDiv.querySelector(`.quiz-opt[data-oi="${oi}"]`).classList.add("selected");
  const allAnswered = quizArea._answers.every(a=>a!==null);
  document.getElementById("submitQuizBtn").disabled = !allAnswered;
};

async function submitQuiz(s){
  const quizArea = document.getElementById("quizArea");
  const answers = quizArea._answers;
  let score = 0;
  s.quiz.forEach((q,qi)=>{
    const qDiv = quizArea.querySelector(`.quiz-q[data-qi="${qi}"]`);
    qDiv.querySelectorAll(".quiz-opt").forEach((el,oi)=>{
      if(oi === q.a) el.classList.add("correct");
      else if(oi === answers[qi]) el.classList.add("incorrect");
    });
    if(answers[qi] === q.a) score++;
  });
  const pct = score / s.quiz.length;
  const passed = pct >= PASS_THRESHOLD;
  state.sectionResults[s.key] = {score, total:s.quiz.length, passed};

  const resultDiv = document.getElementById("quizResult");
  resultDiv.innerHTML = `
    <div class="result-banner ${passed?'result-pass':'result-fail'}">
      You scored ${score}/${s.quiz.length} (${Math.round(pct*100)}%) — ${passed ? "Passed" : "Not yet passing (80% required)"}
    </div>
    <button class="btn-primary" id="nextBtn">${passed ? (state.sectionIndex < SECTIONS.length-1 ? "Next Section" : "Finish Course") : "Retry Section"}</button>
  `;
  document.getElementById("submitQuizBtn").style.display = "none";

  document.getElementById("nextBtn").onclick = async () => {
    if(!passed){ state.screen = "sectionContent"; render(); return; }
    if(state.sectionIndex < SECTIONS.length - 1){
      state.sectionIndex++;
      state.screen = "sectionContent";
      render();
    } else {
      await finishCourse();
    }
  };
}

async function finishCourse(){
  const finalPct = totalScorePct();
  const passedAll = allSectionsPassed();
  state.finalScore = finalPct;
  state.finalPassed = passedAll;
  state.completionDate = new Date().toLocaleDateString();

  try{
    await fetch(RESULTS_ENDPOINT_RECORD, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        name: state.name,
        score: finalPct,
        passed: passedAll,
        date: state.completionDate,
        sectionResults: state.sectionResults
      })
    });
  } catch(e){ /* non-fatal if function not yet deployed */ }

  state.screen = "certificate";
  render();
}

function initDvomWidget(root){
  const circuit = root.querySelector("#dvomCircuit");
  const tps = Array.from(root.querySelectorAll(".dvom-tp"));
  const probeRed = root.querySelector("#dvomProbeRed");
  const probeBlack = root.querySelector("#dvomProbeBlack");
  const meterDisplay = root.querySelector("#dvomMeterDisplay");
  const noteEl = root.querySelector("#dvomNote");
  const powerBtn = root.querySelector("#dvomPowerToggle");
  const switchBtn = root.querySelector("#dvomSwitchToggle");
  const switchIcon = root.querySelector("#dvomSwitchIcon");
  const modeBtns = Array.from(root.querySelectorAll(".dvom-mode-btn"));

  let mode = "V";
  let powerOn = true;
  let switchClosed = true;
  const assign = { red: null, black: null };

  // starting tray positions (below the circuit, inside container coordinate space)
  const trayPositions = {
    red: { left: 220, top: 250 },
    black: { left: 400, top: 250 }
  };

  function placeProbe(el, left, top){
    el.style.left = left + "px";
    el.style.top = top + "px";
  }
  placeProbe(probeRed, trayPositions.red.left, trayPositions.red.top);
  placeProbe(probeBlack, trayPositions.black.left, trayPositions.black.top);

  function nodeVoltage(node){
    if(!powerOn) return 0;
    if(node === "A") return 12;
    if(node === "D") return 0;
    if(node === "C") return 0;
    if(node === "B") return switchClosed ? 12 : 0;
  }

  function resistanceBetween(p1, p2){
    const key = [p1,p2].sort().join("");
    const OL = Infinity;
    const table = {
      "AB": switchClosed ? 0 : OL,
      "BC": 4,
      "CD": 0,
      "AC": switchClosed ? 4 : OL,
      "BD": 4,
      "AD": switchClosed ? 4 : OL
    };
    return table[key];
  }

  function updateModeButtons(){
    modeBtns.forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  }
  modeBtns.forEach(b => b.onclick = () => { mode = b.dataset.mode; updateModeButtons(); evaluate(); });

  powerBtn.onclick = () => {
    powerOn = !powerOn;
    powerBtn.textContent = "Circuit power: " + (powerOn ? "ON" : "OFF");
    powerBtn.className = "dvom-toggle " + (powerOn ? "on" : "off");
    evaluate();
  };
  switchBtn.onclick = () => {
    switchClosed = !switchClosed;
    switchBtn.textContent = "Switch: " + (switchClosed ? "CLOSED" : "OPEN");
    switchBtn.className = "dvom-toggle " + (switchClosed ? "on" : "off");
    switchIcon.style.background = switchClosed ? "#2e7d4f" : "#888";
    switchIcon.textContent = switchClosed ? "SWITCH (closed)" : "SWITCH (open)";
    evaluate();
  };

  function nearestTestPoint(clientX, clientY){
    const rect = circuit.getBoundingClientRect();
    let best = null, bestDist = 26; // px snap threshold
    tps.forEach(tp => {
      const tRect = tp.getBoundingClientRect();
      const tx = tRect.left + tRect.width/2, ty = tRect.top + tRect.height/2;
      const d = Math.hypot(clientX - tx, clientY - ty);
      if(d < bestDist){ bestDist = d; best = tp; }
    });
    return best;
  }

  function makeDraggable(el, colorKey){
    el.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      const rect = circuit.getBoundingClientRect();

      function onMove(ev){
        const left = ev.clientX - rect.left;
        const top = ev.clientY - rect.top;
        placeProbe(el, left, top);
      }
      function onUp(ev){
        el.removeEventListener("pointermove", onMove);
        el.removeEventListener("pointerup", onUp);
        const tp = nearestTestPoint(ev.clientX, ev.clientY);
        tps.forEach(t => t.classList.remove("filled"));
        if(tp){
          const tRect = tp.getBoundingClientRect();
          placeProbe(el, tRect.left - rect.left + tRect.width/2, tRect.top - rect.top + tRect.height/2);
          assign[colorKey] = tp.dataset.point;
          tp.classList.add("filled");
        } else {
          placeProbe(el, trayPositions[colorKey].left, trayPositions[colorKey].top);
          assign[colorKey] = null;
        }
        // re-mark filled for the other probe's point too
        const otherKey = colorKey === "red" ? "black" : "red";
        if(assign[otherKey]){
          const otherTp = tps.find(t => t.dataset.point === assign[otherKey]);
          if(otherTp) otherTp.classList.add("filled");
        }
        evaluate();
      }
      el.addEventListener("pointermove", onMove);
      el.addEventListener("pointerup", onUp);
    });
  }
  makeDraggable(probeRed, "red");
  makeDraggable(probeBlack, "black");

  function setNote(text, isWarn){
    noteEl.textContent = text;
    noteEl.className = "dvom-note" + (isWarn ? " warn" : "");
  }

  function evaluate(){
    const p1 = assign.red, p2 = assign.black;
    if(!p1 || !p2){
      meterDisplay.textContent = "-- . -";
      setNote("Select a meter function and drag both probes onto test points to take a reading.", false);
      return;
    }
    if(p1 === p2){
      meterDisplay.textContent = "0.0";
      setNote("Both probes are on the same point — no difference to measure. Try two different test points.", false);
      return;
    }

    if(mode === "V"){
      const v = Math.abs(nodeVoltage(p1) - nodeVoltage(p2));
      meterDisplay.textContent = v.toFixed(1) + " V";
      if(!powerOn){
        setNote("Circuit power is off, so there's no voltage anywhere in the circuit.", false);
      } else {
        const pair = [p1,p2].sort().join("");
        let note = "Voltage reading between " + p1 + " and " + p2 + ".";
        if(pair === "AB") note = switchClosed
          ? "0.0V across a CLOSED switch — a good switch has no voltage drop."
          : "12.0V across an OPEN switch — full battery voltage appears across an open point in the circuit. Classic sign of an open switch or connection.";
        if(pair === "BC") note = switchClosed
          ? "12.0V across the lamp — this is where the electrical energy is being used to do work (light the lamp)."
          : "0.0V across the lamp — no current is flowing (switch open), so there's nothing for the lamp to drop.";
        if(pair === "CD") note = "0.0V across plain wire — good wire has essentially no resistance, so no voltage drop.";
        if(pair === "AD") note = "12.0V — full battery/source voltage measured across the whole circuit.";
        setNote(note, false);
      }
    } else if(mode === "OHM"){
      if(powerOn){
        meterDisplay.textContent = "-OL-";
        setNote("⚠ Never measure resistance on an energized circuit — turn circuit power OFF first, or you can damage the meter and get a false reading.", true);
        return;
      }
      const r = resistanceBetween(p1, p2);
      if(r === Infinity){
        meterDisplay.textContent = "O.L";
        setNote("Open circuit (infinite resistance) — with the switch open, there's no continuous path between these points. This is exactly how you'd find an open switch or a broken wire.", false);
      } else {
        meterDisplay.textContent = r.toFixed(1) + " Ω";
        const pair = [p1,p2].sort().join("");
        let note = "Resistance reading between " + p1 + " and " + p2 + ".";
        if(pair === "AB") note = "0.0Ω — a closed switch reads as continuity (near-zero resistance).";
        if(pair === "BC") note = "4.0Ω — this is the lamp's own resistance.";
        if(pair === "CD") note = "0.0Ω — plain wire, essentially no resistance.";
        if(pair === "AD" || pair === "AC") note = "Total resistance through the switch and lamp in this path.";
        setNote(note, false);
      }
    } else if(mode === "A"){
      if(!powerOn){
        setNote("Circuit power is off, so no current is flowing — there's nothing to measure yet. Turn power on, then remember: an ammeter must be placed IN SERIES (broken into the circuit path), never across two points.", false);
        meterDisplay.textContent = "0.0 A";
        return;
      }
      meterDisplay.textContent = "-FUSE-";
      setNote("⚠ Blown fuse! You connected the meter across two points like a voltmeter while set to Amps. An ammeter has almost no resistance, so bridging two points this way creates a dead short. To measure current, you must break the circuit open and put the meter IN SERIES with the current path.", true);
    }
  }

  updateModeButtons();
  evaluate();

  // Reposition probes correctly if the window resizes (keeps them anchored to their point/tray).
  window.addEventListener("resize", () => {
    ["red","black"].forEach(key => {
      const el = key === "red" ? probeRed : probeBlack;
      if(assign[key]){
        const tp = tps.find(t => t.dataset.point === assign[key]);
        if(tp){
          const rect = circuit.getBoundingClientRect();
          const tRect = tp.getBoundingClientRect();
          placeProbe(el, tRect.left - rect.left + tRect.width/2, tRect.top - rect.top + tRect.height/2);
          return;
        }
      }
      placeProbe(el, trayPositions[key].left, trayPositions[key].top);
    });
  });
}

/* ---------------- DOC VIEWER ---------------- */
window.openDoc = function(id){
  const doc = REFERENCE_DOCS.find(d=>d.id===id);
  if(!doc) return;
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.onclick = (e)=>{ if(e.target===overlay) document.body.removeChild(overlay); };
  overlay.innerHTML = `
    <div class="modal-box">
      <button class="btn-secondary modal-close" onclick="this.closest('.modal-overlay').remove()">Close ✕</button>
      <h3>${doc.label}</h3>
      <iframe class="doc-embed" src="${doc.file}"></iframe>
      <p class="small">If the document doesn't display inline, <a href="${doc.file}" target="_blank">open it in a new tab</a>.</p>
    </div>
  `;
  document.body.appendChild(overlay);
};

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

render();
</script>
